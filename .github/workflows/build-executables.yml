name: Build Executables

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.13']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 dearpygui PyInstaller
    
    - name: Build with PyInstaller
      run: |
        python -m PyInstaller gui.spec
        dir dist\
    
    - name: Rename executable
      shell: bash
      run: |
        cd dist
        mv gui.exe gui-windows.exe
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rimworld-modlist-manager-Windows
        path: dist/gui-windows.exe
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/gui-windows.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
