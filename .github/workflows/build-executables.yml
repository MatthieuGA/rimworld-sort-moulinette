name: Build Executables

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[build]

    - name: Resolve release version
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME}"
        if [[ "$VERSION" == v* ]]; then
          VERSION="${VERSION#v}"
        fi
        echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller gui.spec
        dir dist\

    - name: Prepare release package
      shell: bash
      run: |
        cd dist
        mkdir -p RimWorldModlistManager
        mv gui.exe RimWorldModlistManager/gui-windows.exe
        cp ../config.ini.example RimWorldModlistManager/
        cp ../README_RELEASE.txt RimWorldModlistManager/
        mkdir -p RimWorldModlistManager/rwpackageId_database
        cp ../rwpackageId_database/.gitkeep RimWorldModlistManager/rwpackageId_database/

    - name: Create release zip
      shell: bash
      run: |
        cd dist
        7z a -tzip RimWorldModlistManager-Windows-v${{ env.RELEASE_VERSION }}.zip RimWorldModlistManager/
        ls -lh *.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rimworld-modlist-manager-Windows
        path: dist/RimWorldModlistManager-Windows-v${{ env.RELEASE_VERSION }}.zip
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/RimWorldModlistManager-Windows-*.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
